<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>RBB Scores</title>

<style>
:root{
  --bg:#f7f7f7;
  --fg:#111;
  --card:rgba(255,255,255,0.7);
  --border:#ccc;
  --ok:rgba(76,175,80,.18);
  --fail:rgba(244,67,54,.18);
  --danger:#d32f2f;

  --heimColor:rgba(33,150,243,0.15);
  --gastColor:rgba(76,175,80,0.15);
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f0f0f;
    --fg:#fff;
    --card:rgba(30,30,30,0.7);
    --border:#444;
  }
}

body{
  margin:0;
  padding:12px;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--fg);
}

button,input,select{
  font-size:16px;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#fff;
  transition:all .2s ease;
}

button:hover{
  transform:scale(1.03);
}

.hidden{display:none;}

#setupView, #gameView, #historyView {
  margin-top: 65px;
}

/* Pulse Animation */
.pulse {
  animation: pulseAnim .3s ease;
}

@keyframes pulseAnim {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.06); }
  100% { transform: scale(1); }
}

/* History Animation */
.historyFade {
  animation: fadeIn .4s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

/* History Table */
#historyTable td, #historyTable th {
  padding:8px;
  border-bottom:1px solid var(--border);
}

.periodRow {
  background:rgba(0,0,0,0.08);
  font-weight:bold;
  text-align:center;
}

.heimRow {
  background:var(--heimColor);
}

.gastRow {
  background:var(--gastColor);
}
</style>
</head>

<body>

<!-- SETUP VIEW -->
<div id="setupView">
  <div id="appHeader">
    <img src="icon.png" alt="RBB Scores">
  </div>

  <h3 style="text-align:center;">Setup</h3>

  <div style="text-align:center">
    Home <input id="nameHeim" placeholder="Home"><br>
    Guest <input id="nameGast" placeholder="Guest">
  </div>

  <h3 style="text-align:center;">Add Player</h3>

  <div style="text-align:center;margin-bottom:6px;">
    No <input id="num" type="number" style="width:60px;text-align:center;">

    Pts 
    <select id="pts">
      <option value="">--</option>
      <option value="1.0">1.0</option>
      <option value="1.5">1.5</option>
      <option value="2.0">2.0</option>
      <option value="2.5">2.5</option>
      <option value="3.0">3.0</option>
      <option value="3.5">3.5</option>
      <option value="4.0">4.0</option>
      <option value="4.5">4.5</option>
    </select>

    <button id="jbBtn" class="bonus-btn jb">JB</button>
    <button id="fbBtn" class="bonus-btn fb">FB</button>
  </div>

  <div style="text-align:center;margin-bottom:8px;">
    <select id="teamSelect">
      <option value="heim">Home</option>
      <option value="gast">Guest</option>
    </select>

    <button onclick="addPlayer()">＋ Add</button>
  </div>

  <div class="container">
    <div class="team">
      <h3 id="heimTitleSetup"></h3>
      <div id="heimPlayersSetup" class="players"></div>
    </div>
    <div class="team">
      <h3 id="gastTitleSetup"></h3>
      <div id="gastPlayersSetup" class="players"></div>
    </div>
  </div>

  <div style="text-align:center;margin-top:10px">
    <button onclick="startGame()">Start Game View</button>
  </div>
</div>

<!-- GAME VIEW -->
<div id="gameView" class="hidden">

  <div class="periods" id="periodTimeline">
    <div data-p="Q1">Q1</div>
    <div data-p="Q2">Q2</div>
    <div data-p="Q3">Q3</div>
    <div data-p="Q4">Q4</div>
    <div data-p="OT">OT</div>
  </div>

  <div style="text-align:center;margin-bottom:10px;">
    <div id="gameStatus"><strong>Game not started</strong></div>
    <button onclick="startRealGame()" id="realStartBtn">▶ Start Game</button>
    <button onclick="endQuarter()" id="endQuarterBtn" class="hidden">⏹ End Quarter</button>
    <button onclick="nextQuarter()" id="nextQuarterBtn" class="hidden">▶ Start Next Quarter</button>
  </div>

  <div class="container">
    <div class="team" id="heimTeam">
      <h3 id="heimTitle"></h3>
      <div id="heimPlayers" class="players"></div>
      <div id="heimStatus" class="status"></div>
    </div>

    <div class="team" id="gastTeam">
      <h3 id="gastTitle"></h3>
      <div id="gastPlayers" class="players"></div>
      <div id="gastStatus" class="status"></div>
    </div>
  </div>

  <div style="text-align:center;margin-top:15px">
    <button onclick="showHistory()">📄 Show History</button>
  </div>

  <div style="text-align:center;margin-top:10px">
    <button onclick="adminReset()">Admin Reset</button>
  </div>
</div>

<!-- HISTORY VIEW -->
<div id="historyView" class="hidden historyFade">

  <h3 style="text-align:center;">History</h3>

  <table id="historyTable" style="width:100%;border-collapse:collapse;margin-top:20px;">
    <thead>
      <tr>
        <th>Time</th>
        <th>Period</th>
        <th>Team</th>
        <th>Players</th>
        <th>Total Pts</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div style="text-align:center;margin-top:20px;">
    <button onclick="backToGame()">⬅ Back to Game</button>
  </div>

  <div style="text-align:center;margin-top:10px;">
    <button class="danger-btn" onclick="finishGame()">⚠ Finish Game</button>
  </div>

</div>

<script src="app.js"></script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
